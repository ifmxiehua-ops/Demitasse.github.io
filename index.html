<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王浩宇的个人主页 | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#a855f7', // 更加接近图片的紫色
                        dark: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 地图容器背景：匹配图片中的深色渐变 */
        .map-container-bg {
            background: radial-gradient(circle at 20% 30%, #1e293b 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        /* 模拟图片中的光晕装饰 */
        .glow-effect {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0) 70%);
            filter: blur(40px);
            z-index: 1;
        }

        .map-toggle-btn.active {
            background-color: #a855f7;
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-950 dark:text-gray-100 transition-colors duration-300">

    <!-- 导航栏 -->
    <nav class="fixed w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b dark:border-slate-800 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <span class="font-bold text-xl text-primary"><i class="fas fa-terminal mr-2"></i>Haoyu.Dev</span>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="#home" class="hover:text-primary transition-colors">首页</a>
                    <a href="#about" class="hover:text-primary transition-colors">关于</a>
                    <a href="#travel" class="hover:text-primary transition-colors">足迹</a>
                    <a href="#projects" class="hover:text-primary transition-colors">项目</a>
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="p-2 text-2xl"><i class="fas fa-bars"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 首页 Hero -->
    <section id="home" class="min-h-screen flex items-center justify-center pt-16 px-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-12">
            <div class="md:w-1/2 text-center md:text-left">
                <p class="text-primary font-mono mb-2 fade-in-up">你好, 我是</p>
                <h1 class="text-5xl md:text-7xl font-extrabold mb-4 fade-in-up delay-100 tracking-tight">
                    王浩宇
                </h1>
                <h2 class="text-2xl md:text-3xl text-slate-500 dark:text-slate-400 mb-6 fade-in-up delay-200">
                    <span id="typing-text" class="typing-cursor"></span>
                </h2>
                <p class="text-slate-600 dark:text-slate-400 mb-8 max-w-lg fade-in-up delay-300 leading-relaxed">
                    同济大学在读，主攻海洋技术与计算机科学。在数据的深度与世界的广度之间，寻找探索的意义。
                </p>
                <div class="flex justify-center md:justify-start space-x-4 fade-in-up delay-300">
                    <a href="#travel" class="bg-primary hover:bg-purple-600 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all hover:scale-105">
                        探索足迹
                    </a>
                    <a href="#projects" class="border border-slate-300 dark:border-slate-700 hover:border-primary px-8 py-3 rounded-full font-bold transition-all">
                        查看项目
                    </a>
                </div>
            </div>
            <div class="md:w-1/2 flex justify-center fade-in-up">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-purple-600 to-blue-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                    <div class="relative w-64 h-64 md:w-80 md:h-80 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center text-7xl border-4 border-white dark:border-slate-900 shadow-2xl">
                         <i class="fas fa-user-astronomer text-primary"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 足迹 Section -->
    <section id="travel" class="py-24 bg-white dark:bg-slate-950">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                <div>
                    <h2 class="text-4xl font-bold mb-4">探索足迹</h2>
                    <div class="w-16 h-1 bg-primary rounded"></div>
                </div>
                <!-- 视图切换按钮 -->
                <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border dark:border-slate-800">
                    <button id="btn-world" class="map-toggle-btn active px-6 py-2 rounded-lg text-sm font-bold transition-all">
                        <i class="fas fa-globe-asia mr-2"></i>全球
                    </button>
                    <button id="btn-china" class="map-toggle-btn px-6 py-2 rounded-lg text-sm font-bold transition-all">
                        <i class="fas fa-map-marker-alt mr-2"></i>中国
                    </button>
                </div>
            </div>

            <!-- 地图主体 -->
            <div class="map-container-bg rounded-3xl p-4 md:p-8 shadow-2xl min-h-[500px] md:min-h-[650px] flex flex-col">
                <!-- 光晕装饰 -->
                <div class="glow-effect top-0 left-0"></div>
                <div class="glow-effect bottom-0 right-0" style="background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(59, 130, 246, 0) 70%);"></div>
                
                <!-- 统计头部 -->
                <div class="relative z-10 flex items-center justify-center mb-4 space-x-6">
                    <div id="map-title" class="text-white text-xl font-bold flex items-center">
                        <i class="fas fa-globe mr-3 text-blue-400"></i> 
                        <span>全球 · 6个国家</span>
                    </div>
                </div>

                <!-- ECharts 容器 -->
                <div id="echarts-map" class="flex-grow w-full relative z-10" style="min-height: 450px;"></div>
                
                <!-- 地图底部截止日期 -->
                <div class="relative z-10 text-right text-slate-500 text-xs mt-4">
                    截止至 2026年2月11日
                </div>
            </div>

            <!-- 数据卡片 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                <div class="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl border dark:border-slate-800 text-center">
                    <div class="text-3xl font-black text-primary mb-1">6</div>
                    <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">已访国家</div>
                </div>
                <div class="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl border dark:border-slate-800 text-center">
                    <div class="text-3xl font-black text-blue-500 mb-1">28</div>
                    <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">国内城市</div>
                </div>
                <div class="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl border dark:border-slate-800 text-center">
                    <div class="text-3xl font-black text-emerald-500 mb-1">100%</div>
                    <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">热爱程度</div>
                </div>
                <div class="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl border dark:border-slate-800 text-center">
                    <div class="text-3xl font-black text-orange-500 mb-1">Next</div>
                    <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">冰岛 / 瑞士</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 项目 Section (保持原样但微调样式) -->
    <section id="projects" class="py-24 bg-slate-50 dark:bg-slate-900">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-4xl font-bold text-center mb-16">个人项目经历</h2>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="bg-white dark:bg-slate-800 rounded-3xl overflow-hidden shadow-xl hover:-translate-y-2 transition-all">
                    <div class="h-48 bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center text-white text-5xl">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="p-8">
                        <h3 class="text-xl font-bold mb-3">无损低时延传输系统</h3>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mb-6 leading-relaxed">
                            基于 Node.js 与 UDP 协议开发的自研传输方案，实现大规模并发下的极低丢包率，适用于科研数据实时回传。
                        </p>
                        <div class="flex flex-wrap gap-2 mb-6">
                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-full text-xs font-bold">C++</span>
                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-full text-xs font-bold">WebSocket</span>
                        </div>
                        <a href="#" class="text-primary font-bold inline-flex items-center hover:gap-2 transition-all">
                            查看详情 <i class="fas fa-arrow-right ml-2 text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="py-12 border-t dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">&copy; 2024 Wang Haoyu. 构建于同济大学.</p>
        </div>
    </footer>

    <script>
        // 1. 打字机
        const texts = ["05在读大学生", "同济海洋人"];
        let count = 0, index = 0;
        function type() {
            if (count === texts.length) count = 0;
            let currentText = texts[count];
            let letter = currentText.slice(0, ++index);
            document.getElementById('typing-text').textContent = letter;
            if (letter.length === currentText.length) {
                count++; index = 0;
                setTimeout(type, 2000);
            } else {
                setTimeout(type, 150);
            }
        }
        type();

        // 2. 主题切换
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // ===================================================
        // 3. ECharts 地图逻辑 (核心修改)
        // ===================================================
        const chart = echarts.init(document.getElementById('echarts-map'));
        
        // 数据定义
        const visitedCountries = [
            {name: 'China', value: 1},
            {name: 'United States', value: 1},
            {name: 'Japan', value: 1},
            {name: 'France', value: 1},
            {name: 'United Kingdom', value: 1},
            {name: 'Thailand', value: 1}
        ];

        // 模拟图片5.jpg中的国内省份着色数据
        const visitedProvinces = [
            {name: '北京', value: 1}, {name: '上海', value: 1}, {name: '广东', value: 1},
            {name: '四川', value: 1}, {name: '陕西', value: 1}, {name: '黑龙江', value: 1},
            {name: '内蒙古', value: 1}, {name: '浙江', value: 1}, {name: '江苏', value: 1},
            {name: '福建', value: 1}, {name: '湖北', value: 1}, {name: '云南', value: 1}
        ];

        async function initMap(type) {
            chart.showLoading({ maskColor: 'rgba(15, 23, 42, 0.8)', textColor: '#fff' });
            
            const mapUrl = type === 'world' 
                ? 'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json'
                : 'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json';
            
            try {
                const response = await fetch(mapUrl);
                const geoJson = await response.json();
                echarts.registerMap(type, geoJson);

                const option = {
                    tooltip: {
                        trigger: 'item',
                        formatter: '{b}',
                        backgroundColor: '#1e293b',
                        borderColor: '#a855f7',
                        textStyle: { color: '#fff' }
                    },
                    visualMap: {
                        show: false,
                        min: 0,
                        max: 1,
                        inRange: {
                            color: ['#ffffff', '#a855f7'] // 未访白色，已访紫色
                        }
                    },
                    series: [{
                        type: 'map',
                        map: type,
                        roam: true,
                        emphasis: {
                            label: { show: false },
                            itemStyle: { areaColor: '#c084fc' }
                        },
                        itemStyle: {
                            borderColor: '#e2e8f0', // 省份边界线颜色
                            borderWidth: 0.5,
                            areaColor: '#ffffff'
                        },
                        data: type === 'world' ? visitedCountries : visitedProvinces
                    }]
                };

                // 针对图片风格的视觉微调
                if (type === 'world') {
                    // 修正世界地图名称映射（视GeoJSON版本而定，有时需要手动对齐）
                }

                chart.hideLoading();
                chart.setOption(option);
            } catch (err) {
                console.error("地图加载失败:", err);
            }
        }

        // 按钮交互
        const btnWorld = document.getElementById('btn-world');
        const btnChina = document.getElementById('btn-china');
        const mapTitle = document.getElementById('map-title');

        btnWorld.onclick = () => {
            btnWorld.classList.add('active');
            btnChina.classList.remove('active');
            mapTitle.innerHTML = '<i class="fas fa-globe mr-3 text-blue-400"></i>全球 · 6个国家';
            initMap('world');
        };

        btnChina.onclick = () => {
            btnChina.classList.add('active');
            btnWorld.classList.remove('active');
            mapTitle.innerHTML = '<i class="fas fa-map mr-3 text-red-400"></i>中国 · 28个城市';
            initMap('china');
        };

        // 初始加载
        initMap('world');

        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
